[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathparity"
version = "0.1.0"
description = "Find file-tree names that break on another operating system."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "juwonllee2024-dotcom" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pathparity = "pathparity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
